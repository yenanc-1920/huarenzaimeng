name: CI/CD Pipeline

on:
  push:
    branches: [develop, master]
    paths:
      - 'server/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'server/**'

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAME: tcb-100050877478-dtwn/ca-ofkhgszn_springboot-5lcf
  TCB_ENV_ID: prod-d3g9ntdmsdf9d7877

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Run tests
        run: mvn test -B
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/target/huarenzaimeng-server.jar
          retention-days: 7

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built jar
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: server/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.ci
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - name: Deploy to WeChat Cloud Hosting (dev)
        run: |
          echo "::notice::Dev deployment triggered for image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # TODO: 接入云托管 OpenAPI 或 tcb CLI 触发部署
          # curl -X POST "https://api.cloud.tencent.com/tcb/v1/envs/${{ env.TCB_ENV_ID }}/services/server/releases" \
          #   -H "Authorization: Bearer ${{ secrets.TCB_API_TOKEN }}" \
          #   -d '{"image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"}'

  deploy-prod:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://cloud.weixin.qq.com/cloudrun
    steps:
      - name: Deploy to WeChat Cloud Hosting (prod)
        run: |
          echo "::notice::Production deployment requires manual approval via GitHub Environment protection rules"
          echo "::notice::Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # TODO: 接入云托管 OpenAPI 触发生产部署（灰度 → 全量）
