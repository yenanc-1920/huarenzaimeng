name: CI

on:
  push:
    branches: [develop, master]
    paths:
      - 'server/**'
      - 'admin/**'
      - 'mini/**'
      - 'sql/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'server/**'
      - 'admin/**'
      - 'mini/**'
      - 'sql/**'
      - '.github/workflows/ci.yml'

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build server
        run: mvn clean package -DskipTests -B

      - name: Run server tests
        run: mvn test -B

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Verify embedded admin entry
        run: |
          test -f admin/dist/index.html
          test -f server/src/main/resources/static/console/index.html
          grep -q '/api/console/assets/' server/src/main/resources/static/console/index.html
          grep -q '<div id="app"></div>' server/src/main/resources/static/console/index.html

  mini:
    name: Mini program build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mini/package-lock.json

      - name: Install mini program dependencies
        working-directory: mini
        run: npm ci

      - name: Build WeChat mini program
        working-directory: mini
        run: npm run build:mp-weixin