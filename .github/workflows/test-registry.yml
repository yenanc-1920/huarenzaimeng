name: Registry Connectivity Test

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/test-registry.yml'

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Verify login success
        run: echo "Registry login OK - ccr.ccs.tencentyun.com is reachable and credentials are valid"
