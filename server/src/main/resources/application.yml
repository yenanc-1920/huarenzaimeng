server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/huarenzaimeng?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  wx:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    mch-id: ${WX_MCH_ID:}
    mch-key: ${WX_MCH_KEY:}
  reloadly:
    client-id: ${RELOADLY_CLIENT_ID:}
    client-secret: ${RELOADLY_CLIENT_SECRET:}
    auth-url: https://auth.reloadly.com/oauth/token
    api-url: https://topups.reloadly.com
  jwt:
    secret: ${JWT_SECRET:huarenzaimeng-v1-secret-key}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  internal:
    secret: ${INTERNAL_API_SECRET:huarenzaimeng-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
